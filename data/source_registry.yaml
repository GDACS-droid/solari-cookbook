  access_basis: PUBLIC_DOWNLOAD | OPEN_DATA_API | PAID_LICENSE | EXPRESS_PERMISSION | REVIEW_REQUIRED
  confidence: desk_verified | source_declared | candidate | unknown
  adapter_status: enabled_sample | gated | research_only | not_started
  terms_or_use_notes: 'verified wording where known; otherwise explicitly unverified'
